<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>单帧成影 · 图片转 GIF</title>
  <style>
    :root {
      --ink: #17201d;
      --muted: #65706b;
      --paper: #f7f5ef;
      --surface: #ffffff;
      --line: #d9ded9;
      --mint: #cceadd;
      --green: #12664f;
      --coral: #e8654a;
      --yellow: #f1c95b;
      --shadow: 0 18px 50px rgba(23, 32, 29, .1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(rgba(23, 32, 29, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 32, 29, .035) 1px, transparent 1px),
        var(--paper);
      background-size: 28px 28px;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      letter-spacing: 0;
    }

    button, input { font: inherit; }
    button { letter-spacing: 0; }

    .shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 42px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--ink);
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      color: white;
      background: var(--coral);
      border-radius: 6px;
      box-shadow: 5px 5px 0 var(--ink);
      font: 800 18px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    h1 { margin: 0; font-size: clamp(25px, 3vw, 40px); line-height: 1.08; }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
    .privacy {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
    }
    .privacy::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px var(--mint); }

    main {
      display: grid;
      grid-template-columns: minmax(290px, 360px) minmax(0, 1fr);
      min-height: 650px;
      margin-top: 28px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--ink);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .controls { display: flex; flex-direction: column; padding: 28px; border-right: 1px solid var(--ink); }
    .step { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 13px; font-weight: 800; text-transform: uppercase; }
    .step span { display: grid; place-items: center; width: 24px; height: 24px; color: white; background: var(--ink); border-radius: 50%; }

    .drop-zone {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 246px;
      padding: 28px 22px;
      text-align: center;
      background: #fbfcfa;
      border: 1.5px dashed #9aa69f;
      border-radius: 6px;
      transition: .18s ease;
      cursor: pointer;
    }
    .drop-zone:hover, .drop-zone.dragging { background: #eff8f3; border-color: var(--green); transform: translateY(-2px); }
    .drop-zone.has-file { background: #eff8f3; border-style: solid; border-color: var(--green); }
    .drop-icon { display: grid; place-items: center; width: 58px; height: 58px; margin: 0 auto 18px; color: var(--green); background: var(--mint); border-radius: 50%; font-size: 30px; font-weight: 300; }
    .drop-zone strong { display: block; margin-bottom: 7px; font-size: 17px; }
    .drop-zone p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    #fileInput { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    .file-info { min-height: 78px; margin: 18px 0; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .file-name { overflow: hidden; margin: 0 0 8px; font-size: 14px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .file-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; color: var(--muted); font-size: 12px; }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { height: 48px; border: 1px solid var(--ink); border-radius: 5px; font-weight: 800; cursor: pointer; transition: .16s ease; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn:not(:disabled):hover { transform: translateY(-2px); box-shadow: 3px 3px 0 var(--ink); }
    .btn-primary { color: white; background: var(--green); }
    .btn-secondary { color: var(--ink); background: var(--yellow); }

    .status { min-height: 56px; margin-top: 16px; padding: 12px 13px; color: var(--muted); background: #f4f5f2; border-left: 3px solid var(--line); font-size: 12px; line-height: 1.55; }
    .status.working { color: #7a5510; background: #fff8df; border-color: var(--yellow); }
    .status.success { color: var(--green); background: #eff8f3; border-color: var(--green); }
    .status.error { color: #9e3322; background: #fff0ed; border-color: var(--coral); }

    .preview-area { display: grid; grid-template-rows: auto 1fr; min-width: 0; background: #f0f1ed; }
    .preview-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 22px; background: white; border-bottom: 1px solid var(--ink); }
    .preview-head h2 { margin: 0; font-size: 16px; }
    .output-stats { color: var(--muted); font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .preview-grid { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
    figure { display: flex; flex-direction: column; min-width: 0; margin: 0; padding: 20px; }
    figure + figure { border-left: 1px solid var(--line); }
    figcaption { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; font-size: 13px; font-weight: 800; }
    .badge { padding: 4px 7px; color: var(--muted); background: white; border: 1px solid var(--line); border-radius: 3px; font: 10px/1 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .stage {
      position: relative;
      display: grid;
      place-items: center;
      flex: 1;
      min-height: 440px;
      overflow: hidden;
      background-color: white;
      background-image: linear-gradient(45deg, #e8eae6 25%, transparent 25%), linear-gradient(-45deg, #e8eae6 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e8eae6 75%), linear-gradient(-45deg, transparent 75%, #e8eae6 75%);
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-size: 20px 20px;
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    .stage img, .stage canvas { display: none; max-width: 100%; max-height: 100%; object-fit: contain; }
    .stage #outputImage { width: 100%; height: 100%; }
    .stage img.visible, .stage canvas.visible { display: block; }
    .empty-state { max-width: 190px; padding: 16px; color: #808a85; background: rgba(255,255,255,.9); text-align: center; font-size: 12px; line-height: 1.6; }
    .empty-state b { display: block; margin-bottom: 5px; color: var(--ink); font-size: 14px; }

    @media (max-width: 900px) {
      .shell { width: min(100% - 24px, 700px); padding-top: 22px; }
      header { align-items: flex-start; }
      .privacy { display: none; }
      main { grid-template-columns: 1fr; }
      .controls { border-right: 0; border-bottom: 1px solid var(--ink); }
      .drop-zone { min-height: 210px; }
      .preview-grid { grid-template-columns: 1fr; }
      figure + figure { border-left: 0; border-top: 1px solid var(--line); }
      .stage { min-height: 330px; max-height: 520px; }
    }
    @media (max-width: 520px) {
      .shell { width: calc(100% - 16px); }
      .brand-mark { width: 40px; height: 40px; }
      .controls { padding: 20px; }
      .preview-head { align-items: flex-start; flex-direction: column; }
      figure { padding: 14px; }
      .stage { min-height: 280px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <div class="brand-mark">GIF</div>
        <div>
          <h1>单帧成影</h1>
          <p class="subtitle">将图片压缩并封装为单帧 GIF</p>
        </div>
      </div>
      <div class="privacy">全程在本地浏览器处理</div>
    </header>

    <main>
      <section class="controls" aria-label="转换控制区">
        <div class="step"><span>1</span> 选择图片</div>
        <label class="drop-zone" id="dropZone" for="fileInput" tabindex="0">
          <input id="fileInput" type="file" accept=".png,.jpg,.jpeg,.tif,.tiff,image/png,image/jpeg,image/tiff">
          <div>
            <div class="drop-icon">+</div>
            <strong id="dropTitle">拖拽图片到这里</strong>
            <p id="dropText">或点击浏览本地文件<br>PNG · JPG · JPEG · TIFF</p>
          </div>
        </label>

        <div class="file-info">
          <p class="file-name" id="fileName">尚未选择文件</p>
          <div class="file-meta"><span id="fileType">—</span><span id="fileSize">—</span><span id="dimensions">—</span></div>
        </div>

        <div class="step"><span>2</span> 转换与保存</div>
        <div class="actions">
          <button class="btn btn-primary" id="convertBtn" disabled>转换</button>
          <button class="btn btn-secondary" id="saveBtn" disabled>保存</button>
        </div>
        <div class="status" id="status" role="status" aria-live="polite">目标不超过 20 KB；始终使用完整自适应调色板，仅在必要时等比降低分辨率。</div>
      </section>

      <section class="preview-area" aria-label="图片预览区">
        <div class="preview-head">
          <h2>输入 / 输出对照</h2>
          <div class="output-stats" id="outputStats">等待转换</div>
        </div>
        <div class="preview-grid">
          <figure>
            <figcaption>原始图片 <span class="badge">INPUT</span></figcaption>
            <div class="stage">
              <canvas id="inputCanvas"></canvas>
              <div class="empty-state" id="inputEmpty"><b>等待输入</b>选择文件后在这里查看原图</div>
            </div>
          </figure>
          <figure>
            <figcaption>GIF 结果 <span class="badge">OUTPUT</span></figcaption>
            <div class="stage">
              <img id="outputImage" alt="转换后的 GIF 预览">
              <div class="empty-state" id="outputEmpty"><b>等待转换</b>生成的单帧 GIF 将显示在这里</div>
            </div>
          </figure>
        </div>
      </section>
    </main>
  </div>

  <script>
    const TARGET_BYTES = 20 * 1024;
    const MAX_PIXELS = 40_000_000;
    const state = { file: null, imageData: null, gifBlob: null, outputUrl: null };

    const $ = (id) => document.getElementById(id);
    const dropZone = $('dropZone');
    const fileInput = $('fileInput');
    const convertBtn = $('convertBtn');
    const saveBtn = $('saveBtn');
    const inputCanvas = $('inputCanvas');
    const outputImage = $('outputImage');

    const formatBytes = (bytes) => bytes < 1024 ? `${bytes} B` : bytes < 1024 ** 2 ? `${(bytes / 1024).toFixed(1)} KB` : `${(bytes / 1024 ** 2).toFixed(2)} MB`;
    const setStatus = (message, type = '') => { $('status').textContent = message; $('status').className = `status ${type}`.trim(); };
    const nextFrame = () => new Promise((resolve) => requestAnimationFrame(() => setTimeout(resolve, 0)));

    function resetOutput() {
      state.gifBlob = null;
      saveBtn.disabled = true;
      $('outputStats').textContent = '等待转换';
      outputImage.classList.remove('visible');
      $('outputEmpty').style.display = '';
      if (state.outputUrl) URL.revokeObjectURL(state.outputUrl);
      state.outputUrl = null;
    }

    async function loadFile(file) {
      resetOutput();
      const ext = file.name.split('.').pop().toLowerCase();
      if (!['png', 'jpg', 'jpeg', 'tif', 'tiff'].includes(ext)) {
        setStatus('不支持该文件格式。请选择 PNG、JPG、JPEG 或 TIFF。', 'error');
        return;
      }
      setStatus('正在读取并解析图片…', 'working');
      try {
        const imageData = ['tif', 'tiff'].includes(ext) ? await decodeTiff(await file.arrayBuffer()) : await decodeBrowserImage(file);
        if (imageData.width * imageData.height > MAX_PIXELS) throw new Error('图片像素超过 4000 万，浏览器内存不足以安全处理。');
        state.file = file;
        state.imageData = imageData;
        inputCanvas.width = imageData.width;
        inputCanvas.height = imageData.height;
        inputCanvas.getContext('2d', { alpha: true }).putImageData(imageData, 0, 0);
        inputCanvas.classList.add('visible');
        $('inputEmpty').style.display = 'none';
        $('fileName').textContent = file.name;
        $('fileType').textContent = ext.toUpperCase();
        $('fileSize').textContent = formatBytes(file.size);
        $('dimensions').textContent = `${imageData.width} × ${imageData.height}`;
        $('dropTitle').textContent = '图片已就绪';
        $('dropText').textContent = '点击或拖拽可替换文件';
        dropZone.classList.add('has-file');
        convertBtn.disabled = false;
        setStatus('图片读取完成。点击“转换”生成单帧 GIF。', 'success');
      } catch (error) {
        state.file = null;
        state.imageData = null;
        convertBtn.disabled = true;
        setStatus(error.message || '图片解析失败，请尝试其他文件。', 'error');
      }
    }

    async function decodeBrowserImage(file) {
      const bitmap = await createImageBitmap(file);
      const canvas = document.createElement('canvas');
      canvas.width = bitmap.width; canvas.height = bitmap.height;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(bitmap, 0, 0); bitmap.close();
      return ctx.getImageData(0, 0, canvas.width, canvas.height);
    }

    // Baseline TIFF reader: strips, chunky pixels, 1/8/16-bit gray/RGB/RGBA/palette.
    async function decodeTiff(buffer) {
      const view = new DataView(buffer);
      const little = view.getUint16(0, false) === 0x4949;
      const u16 = (o) => view.getUint16(o, little);
      const u32 = (o) => view.getUint32(o, little);
      if ((!little && view.getUint16(0, false) !== 0x4d4d) || u16(2) !== 42) throw new Error('这不是有效的 Baseline TIFF 文件。');
      const ifd = u32(4), count = u16(ifd), tags = new Map();
      const typeSize = [0,1,1,2,4,8,1,1,2,4,8,4,8];
      for (let i = 0; i < count; i++) {
        const p = ifd + 2 + i * 12, tag = u16(p), type = u16(p + 2), n = u32(p + 4), bytes = (typeSize[type] || 1) * n;
        const base = bytes <= 4 ? p + 8 : u32(p + 8), vals = [];
        for (let j = 0; j < n; j++) {
          const q = base + j * (typeSize[type] || 1);
          vals.push(type === 3 ? u16(q) : type === 4 ? u32(q) : view.getUint8(q));
        }
        tags.set(tag, vals);
      }
      const one = (tag, fallback) => tags.has(tag) ? tags.get(tag)[0] : fallback;
      const width = one(256), height = one(257), compression = one(259, 1), photo = one(262, 2), samples = one(277, 1);
      const bits = tags.get(258) || [8], offsets = tags.get(273), lengths = tags.get(279), rowsPerStrip = one(278, height);
      if (!width || !height || !offsets || !lengths) throw new Error('TIFF 缺少尺寸或像素条带信息。');
      if (one(284, 1) !== 1) throw new Error('暂不支持分平面存储的 TIFF，请导出为交错像素 TIFF。');
      if (![1, 5, 8, 32946, 32773].includes(compression)) throw new Error(`暂不支持 TIFF 压缩类型 ${compression}。`);
      if (!bits.every((b) => [1, 8, 16].includes(b))) throw new Error('该 TIFF 的位深暂不支持（支持 1、8、16 bit）。');
      const bytesPerRow = Math.ceil(width * bits.reduce((a,b) => a + b, 0) / 8);
      const raw = new Uint8Array(bytesPerRow * height); let outAt = 0;
      for (let i = 0; i < offsets.length; i++) {
        const src = new Uint8Array(buffer, offsets[i], lengths[Math.min(i, lengths.length - 1)]);
        const expected = Math.min(rowsPerStrip, height - i * rowsPerStrip) * bytesPerRow;
        let decoded;
        if (compression === 1) decoded = src;
        else if (compression === 32773) decoded = decodePackBits(src, expected);
        else if (compression === 5) decoded = decodeTiffLzw(src, expected);
        else decoded = await inflateTiff(src);
        raw.set(decoded.subarray(0, expected), outAt); outAt += expected;
      }
      if (one(317, 1) === 2 && bits.every((b) => b === 8)) {
        for (let y = 0; y < height; y++) for (let x = samples; x < bytesPerRow; x++) raw[y * bytesPerRow + x] = (raw[y * bytesPerRow + x] + raw[y * bytesPerRow + x - samples]) & 255;
      }
      const rgba = new Uint8ClampedArray(width * height * 4), palette = tags.get(320);
      const getSample = (bitAt, depth) => {
        const byte = raw[bitAt >> 3];
        if (depth === 1) return ((byte >> (7 - (bitAt & 7))) & 1) * 255;
        if (depth === 8) return byte;
        const pos = bitAt >> 3; return Math.round((little ? raw[pos + 1] << 8 | raw[pos] : raw[pos] << 8 | raw[pos + 1]) / 257);
      };
      const bitsPerPixel = bits.reduce((sum, depth) => sum + depth, 0);
      for (let p = 0; p < width * height; p++) {
        let sampleBit = Math.floor(p / width) * bytesPerRow * 8 + (p % width) * bitsPerPixel;
        const values = bits.map((depth) => { const v = getSample(sampleBit, depth); sampleBit += depth; return v; });
        let r, g, b, a = 255;
        if (photo === 2) { [r,g,b] = values; a = values[3] ?? 255; }
        else if (photo === 3 && palette) { const idx = values[0], n = palette.length / 3; r = palette[idx] >> 8; g = palette[idx+n] >> 8; b = palette[idx+2*n] >> 8; }
        else { const v = photo === 0 ? 255 - values[0] : values[0]; r = g = b = v; a = values[1] ?? 255; }
        const q = p * 4; rgba[q] = r; rgba[q+1] = g; rgba[q+2] = b; rgba[q+3] = a;
      }
      return new ImageData(rgba, width, height);
    }

    function decodePackBits(src, expected) {
      const out = new Uint8Array(expected); let i = 0, o = 0;
      while (i < src.length && o < expected) {
        const n = src[i++];
        if (n <= 127) for (let j = 0; j <= n && i < src.length; j++) out[o++] = src[i++];
        else if (n >= 129) { const value = src[i++]; for (let j = 0; j < 257 - n && o < expected; j++) out[o++] = value; }
      }
      return out;
    }

    function decodeTiffLzw(src, expected) {
      let bit = 0, size = 9, next = 258, previous = null;
      let table = Array.from({length: 258}, (_, i) => i < 256 ? [i] : null);
      const output = [];
      const read = () => { let v = 0; for (let i = 0; i < size; i++) { const pos = bit + i; v = (v << 1) | ((src[pos >> 3] >> (7 - (pos & 7))) & 1); } bit += size; return v; };
      while (bit + size <= src.length * 8 && output.length < expected) {
        const code = read();
        if (code === 256) { table = Array.from({length: 258}, (_, i) => i < 256 ? [i] : null); size = 9; next = 258; previous = null; continue; }
        if (code === 257) break;
        let entry = table[code];
        if (!entry && code === next && previous) entry = previous.concat(previous[0]);
        if (!entry) throw new Error('TIFF LZW 数据损坏。');
        output.push(...entry);
        if (previous && next < 4096) { table[next++] = previous.concat(entry[0]); if (next === (1 << size) - 1 && size < 12) size++; }
        previous = entry;
      }
      return Uint8Array.from(output.slice(0, expected));
    }

    async function inflateTiff(src) {
      if (!('DecompressionStream' in window)) throw new Error('当前浏览器不支持 Deflate TIFF 解码。');
      for (const format of ['deflate', 'deflate-raw']) {
        try { return new Uint8Array(await new Response(new Blob([src]).stream().pipeThrough(new DecompressionStream(format))).arrayBuffer()); } catch (_) {}
      }
      throw new Error('TIFF Deflate 数据无法解压。');
    }

    function buildPalette(data, wanted = 256) {
      const pixels = data.length / 4, stride = Math.max(1, Math.floor(pixels / 65536)), points = [], anchors = [];
      const extrema = Array.from({length: 10}, () => ({score: Infinity, color: null}));
      for (let p = 0; p < pixels; p += stride) {
        const q = p * 4, a = data[q+3] / 255;
        const color = [Math.round(data[q]*a + 255*(1-a)), Math.round(data[q+1]*a + 255*(1-a)), Math.round(data[q+2]*a + 255*(1-a))];
        const [r,g,b] = color, chroma = Math.max(r,g,b)-Math.min(r,g,b), luminance = .2126*r+.7152*g+.0722*b;
        [r,-r,g,-g,b,-b,luminance,-luminance,chroma,-chroma].forEach((value,i) => { if(value < extrema[i].score) extrema[i] = {score:value,color}; });
        points.push(color);
      }
      for (const item of extrema) if(item.color && !anchors.some((p)=>p[0]===item.color[0]&&p[1]===item.color[1]&&p[2]===item.color[2])) anchors.push(item.color);
      let boxes = [{ points }];
      while (boxes.length < Math.max(1, wanted - anchors.length)) {
        let best = -1, channel = 0, score = -1;
        boxes.forEach((box, i) => {
          if (box.points.length < 2) return;
          for (let c = 0; c < 3; c++) { let min=255,max=0; for (const p of box.points) { if(p[c]<min)min=p[c]; if(p[c]>max)max=p[c]; } const s=(max-min)*Math.sqrt(box.points.length); if(s>score){score=s;best=i;channel=c;} }
        });
        if (best < 0) break;
        const chosen = boxes.splice(best, 1)[0]; chosen.points.sort((a,b) => a[channel]-b[channel]);
        const mid = chosen.points.length >> 1; boxes.push({points:chosen.points.slice(0,mid)}, {points:chosen.points.slice(mid)});
      }
      const palette = anchors.concat(boxes.map((box) => { const sum = box.points.reduce((a,p)=>[a[0]+p[0],a[1]+p[1],a[2]+p[2]],[0,0,0]); const n=box.points.length||1; return [Math.round(sum[0]/n),Math.round(sum[1]/n),Math.round(sum[2]/n)]; }));
      return palette.filter((color,i)=>palette.findIndex((p)=>p[0]===color[0]&&p[1]===color[1]&&p[2]===color[2])===i).slice(0,wanted);
    }

    function mapPixels(data, palette) {
      const indices = new Uint8Array(data.length / 4);
      const cache = new Int16Array(32768); cache.fill(-1);
      for (let p = 0; p < indices.length; p++) {
        const q=p*4, a=data[q+3]/255, r=Math.round(data[q]*a+255*(1-a)), g=Math.round(data[q+1]*a+255*(1-a)), b=Math.round(data[q+2]*a+255*(1-a));
        const key=(r>>3)<<10|(g>>3)<<5|(b>>3); let best=cache[key];
        if(best<0){let dist=Infinity; for(let i=0;i<palette.length;i++){const dr=r-palette[i][0],dg=g-palette[i][1],db=b-palette[i][2],mean=(r+palette[i][0])>>1,d=((512+mean)*dr*dr>>8)+4*dg*dg+((767-mean)*db*db>>8);if(d<dist){dist=d;best=i;}} cache[key]=best;}
        indices[p]=best;
      }
      return indices;
    }

    function resizeImageData(imageData, targetWidth, targetHeight) {
      const source = document.createElement('canvas');
      source.width = imageData.width; source.height = imageData.height;
      source.getContext('2d').putImageData(imageData, 0, 0);
      let current = source;
      while (current.width > targetWidth * 2 || current.height > targetHeight * 2) {
        const step = document.createElement('canvas');
        step.width = Math.max(targetWidth, Math.round(current.width / 2));
        step.height = Math.max(targetHeight, Math.round(current.height / 2));
        const stepCtx = step.getContext('2d');
        stepCtx.imageSmoothingEnabled = true; stepCtx.imageSmoothingQuality = 'high';
        stepCtx.drawImage(current, 0, 0, step.width, step.height);
        current = step;
      }
      const target = document.createElement('canvas');
      target.width = targetWidth; target.height = targetHeight;
      const ctx = target.getContext('2d', { willReadFrequently: true });
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(current, 0, 0, targetWidth, targetHeight);
      return ctx.getImageData(0, 0, targetWidth, targetHeight);
    }

    function lzwEncode(indices, minSize) {
      const clear=1<<minSize, end=clear+1; let size=minSize+1, next=end+1, dict=new Map();
      const bytes=[]; let bits=0, bitCount=0;
      const write=(code)=>{bits|=code<<bitCount;bitCount+=size;while(bitCount>=8){bytes.push(bits&255);bits>>>=8;bitCount-=8;}};
      const reset=()=>{dict=new Map();size=minSize+1;next=end+1;};
      write(clear);
      if (!indices.length) { write(end); return bytes; }
      let prefix=indices[0];
      for(let i=1;i<indices.length;i++){
        const k=indices[i], key=prefix*256+k, found=dict.get(key);
        if(found!==undefined){prefix=found;continue;}
        write(prefix);
        if(next<4096){dict.set(key,next++);if(next>(1<<size)&&size<12)size++;}
        else {write(clear);reset();}
        prefix=k;
      }
      write(prefix);
      write(end); if(bitCount>0)bytes.push(bits&255); return bytes;
    }

    function encodeGif(width, height, palette, indices) {
      const tablePow=Math.max(1,Math.ceil(Math.log2(Math.max(2,palette.length)))), tableSize=1<<tablePow, minSize=Math.max(2,tablePow);
      const out=[], push16=(n)=>out.push(n&255,(n>>8)&255), text=(s)=>{for(const c of s)out.push(c.charCodeAt(0));};
      text('GIF89a'); push16(width); push16(height); out.push(0x80|0x70|(tablePow-1),0,0);
      for(let i=0;i<tableSize;i++){const p=palette[i]||palette[palette.length-1]||[255,255,255];out.push(p[0],p[1],p[2]);}
      out.push(0x2c); push16(0);push16(0);push16(width);push16(height);out.push(0,minSize);
      const data=lzwEncode(indices,minSize); for(let i=0;i<data.length;i+=255){const n=Math.min(255,data.length-i);out.push(n,...data.slice(i,i+n));}
      out.push(0,0x3b); return new Uint8Array(out);
    }

    async function convert() {
      if (!state.imageData) return;
      convertBtn.disabled = true; saveBtn.disabled = true; resetOutput();
      setStatus('正在保留完整色彩范围并寻找最佳分辨率，请稍候…', 'working');
      try {
        await nextFrame();
        const { width, height } = state.imageData, longest = Math.max(width,height), cache = new Map();
        const encodeAt = (side) => {
          const scale=Math.min(1,side/longest), outputWidth=Math.max(1,Math.round(width*scale)), outputHeight=Math.max(1,Math.round(height*scale));
          const key=`${outputWidth}x${outputHeight}`; if(cache.has(key))return cache.get(key);
          const imageData=scale===1?state.imageData:resizeImageData(state.imageData,outputWidth,outputHeight);
          const palette=buildPalette(imageData.data,256), indices=mapPixels(imageData.data,palette), bytes=encodeGif(outputWidth,outputHeight,palette,indices);
          const encoded={bytes,palette,outputWidth,outputHeight}; cache.set(key,encoded); return encoded;
        };
        let trial=encodeAt(longest), best=trial, limited=false;
        if(trial.bytes.length>TARGET_BYTES){
          let failSide=longest, passSide=0, side=Math.max(48,Math.floor(longest*Math.max(.3,Math.min(.85,Math.sqrt(TARGET_BYTES/trial.bytes.length)*.92))));
          best=null;
          while(!best){
            await nextFrame(); trial=encodeAt(side);
            if(trial.bytes.length<=TARGET_BYTES){best=trial;passSide=side;break;}
            failSide=side;
            if(side===48)throw new Error(`最低可用分辨率结果仍为 ${formatBytes(trial.bytes.length)}，无法达到 20 KB。`);
            side=Math.max(48,Math.floor(side*Math.max(.35,Math.min(.82,Math.sqrt(TARGET_BYTES/trial.bytes.length)*.92))));
          }
          for(let i=0;i<5&&failSide-passSide>2;i++){
            await nextFrame(); const mid=Math.floor((passSide+failSide)/2), candidate=encodeAt(mid);
            if(candidate.bytes.length<=TARGET_BYTES){best=candidate;passSide=mid;}else failSide=mid;
          }
          limited=true;
        }
        const {bytes:result,palette,outputWidth,outputHeight}=best, usedColors=palette.length;
        state.gifBlob=new Blob([result],{type:'image/gif'}); state.outputUrl=URL.createObjectURL(state.gifBlob);
        outputImage.src=state.outputUrl; outputImage.classList.add('visible'); $('outputEmpty').style.display='none'; saveBtn.disabled=false;
        $('outputStats').textContent=`${outputWidth} × ${outputHeight} · ${usedColors} 色 · ${formatBytes(result.length)}`;
        const note=limited?`已保留完整自适应调色板，并按原始比例缩小至 ${outputWidth} × ${outputHeight}。`:'已保留原始尺寸与完整自适应调色板。';
        setStatus(`${note} 输出 ${formatBytes(result.length)}。`,'success');
      } catch(error){setStatus(error.message||'转换失败。','error');}
      finally{convertBtn.disabled=false;}
    }
    async function saveGif() {
      if(!state.gifBlob)return;
      const base=(state.file?.name||'image').replace(/\.[^.]+$/,''); const name=`${base}.gif`;
      try {
        if('showSaveFilePicker' in window){
          const handle=await showSaveFilePicker({suggestedName:name,types:[{description:'GIF 图片',accept:{'image/gif':['.gif']}}]});
          const writable=await handle.createWritable();await writable.write(state.gifBlob);await writable.close();setStatus(`已保存 ${name}。`,'success');
        }else{const a=document.createElement('a');a.href=state.outputUrl;a.download=name;document.body.appendChild(a);a.click();a.remove();setStatus('浏览器已打开下载保存流程。','success');}
      }catch(error){if(error.name!=='AbortError')setStatus('保存失败，请检查浏览器下载权限。','error');}
    }

    fileInput.addEventListener('change',(e)=>e.target.files[0]&&loadFile(e.target.files[0]));
    dropZone.addEventListener('keydown',(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fileInput.click();}});
    ['dragenter','dragover'].forEach((name)=>dropZone.addEventListener(name,(e)=>{e.preventDefault();dropZone.classList.add('dragging');}));
    ['dragleave','drop'].forEach((name)=>dropZone.addEventListener(name,(e)=>{e.preventDefault();dropZone.classList.remove('dragging');}));
    dropZone.addEventListener('drop',(e)=>e.dataTransfer.files[0]&&loadFile(e.dataTransfer.files[0]));
    convertBtn.addEventListener('click',convert); saveBtn.addEventListener('click',saveGif);
  </script>
</body>
</html>
